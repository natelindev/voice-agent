<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent — Real-time Assistant</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-indicator" id="connectionDot"></div>
        <h1 class="brand-title">Voice Agent</h1>
        <span class="version-tag">v0.1.0</span>
      </div>

      <div class="header-center">
        <div class="status-pill" id="statusPill">
          <span class="pill-dot"></span>
          <span class="pill-text" id="statusText">Connecting...</span>
        </div>
      </div>

      <div class="model-tags">
        <span class="tag">gpt-4o-mini</span>
        <span class="tag">coral voice</span>
        <span class="tag">Silero VAD</span>
      </div>
    </header>

    <!-- Main Stage -->
    <main class="main-stage">
      <!-- Voice Visualizer Section -->
      <section class="visualizer-section" aria-label="Voice Visualizer">
        <div class="orb-wrapper">
          <canvas id="orbCanvas" width="480" height="480"></canvas>
        </div>

        <div class="state-headline-wrapper">
          <h2 class="state-headline" id="stateHeadline">Ready</h2>
          <p class="state-subtext" id="stateSubtext">Speak into your microphone naturally. Barge-in is enabled.</p>
        </div>

        <!-- Oscilloscope Waveform -->
        <div class="waveform-wrapper">
          <canvas id="waveformCanvas" width="600" height="70"></canvas>
        </div>
      </section>

      <!-- Live Conversation Panel -->
      <section class="conversation-section" aria-label="Conversation History">
        <div class="conversation-header">
          <div class="conversation-title-group">
            <h3 class="conversation-title">Transcript</h3>
            <span class="turn-count" id="turnCount">0 turns</span>
          </div>
          <div class="conversation-actions">
            <button class="action-btn" id="clearBtn" title="Reset Conversation History (R)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              </svg>
              <span>Clear</span>
            </button>
          </div>
        </div>

        <div class="chat-feed" id="chatFeed">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">🎙️</div>
            <p>Your conversation history will appear here in real time.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Control Dock -->
    <footer class="control-dock">
      <div class="dock-left">
        <div class="level-meter-wrapper" title="Live Microphone Input Level">
          <span class="meter-label">Mic</span>
          <div class="meter-track">
            <div class="meter-fill" id="meterFill"></div>
          </div>
          <span class="meter-value" id="meterValue">0%</span>
        </div>
      </div>

      <div class="dock-center">
        <!-- Mute Button -->
        <button class="dock-btn" id="muteBtn" aria-label="Mute Microphone" title="Toggle Mute (M)">
          <svg id="micIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
          <span id="muteLabel">Mute</span>
          <kbd class="shortcut-key">M</kbd>
        </button>

        <!-- Barge-in / Interrupt Button -->
        <button class="dock-btn dock-btn-interrupt" id="interruptBtn" aria-label="Interrupt Assistant" title="Interrupt Assistant (Space)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          <span>Interrupt</span>
          <kbd class="shortcut-key">Space</kbd>
        </button>
      </div>

      <div class="dock-right">
        <div class="telemetry-chip" id="lastTelemetryChip">
          <span class="telemetry-label">Turn Latency</span>
          <span class="telemetry-time" id="latencyDisplay">—</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="/orb.js"></script>
  <script src="/waveform.js"></script>
  <script src="/app.js"></script>
</body>
</html>
