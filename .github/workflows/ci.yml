name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install PortAudio runtime
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install dependencies
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Run tests
        run: uv run --locked pytest tests/ -q
      - name: Check web companion behavior
        run: node --test tests/test_*.cjs
      - name: Build package
        run: uv build
      - name: Check CLI help
        run: uv run --locked voice-agent --help
