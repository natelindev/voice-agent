[project]
name = "voice-agent"
version = "0.1.0"
description = "Low-latency real-time terminal voice assistant with VAD, ASR, LLM, and TTS"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nate Lin" },
]
keywords = [
    "voice-assistant",
    "speech-recognition",
    "text-to-speech",
    "openai",
    "silero-vad",
    "realtime",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.70.0",
    "sounddevice>=0.5.1",
    "numpy>=2.2.4",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
voice-agent = "voice_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/natelindev/voice-agent"
Repository = "https://github.com/natelindev/voice-agent"
Issues = "https://github.com/natelindev/voice-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
