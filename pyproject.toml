[project]
name = "voice-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.70.0",
    "sounddevice>=0.5.1",
    "numpy>=2.2.4",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
voice-agent = "voice_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
